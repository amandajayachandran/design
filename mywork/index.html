<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amanda Jayachandran</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/mywork/mywork.css" />
</head>
<body class="mywork-body">

  <main class="mywork-gate">

    <section class="mywork-step" data-step="gate" id="step-gate">
      <p class="section-kicker section-kicker--void">Private</p>
      <h1>Enter password</h1>
      <p class="mywork-copy">
        This page was shared with you directly. Enter your email and
        the password you were given to view Amanda's work.
      </p>
      <form id="gate-form" class="mywork-form mywork-form--stacked">
        <label for="email-input" class="sr-only">Email address</label>
        <input type="email" id="email-input" placeholder="you@company.com" required autocomplete="email" />
        <label for="password-input" class="sr-only">Password</label>
        <input type="password" id="password-input" placeholder="Password" required autocomplete="current-password" />
        <button type="submit" class="mywork-button">View Amanda's Work</button>
      </form>
      <p class="mywork-status" id="gate-status" role="status" aria-live="polite"></p>
    </section>

    <section class="mywork-step" data-step="video" id="step-video" hidden>
      <p class="section-kicker section-kicker--void">ROAR</p>
      <h1>Amanda Jayachandran</h1>
      <div class="video-wrap">
        <video
          id="mywork-video"
          controls
          controlsList="nodownload noremoteplayback"
          disablePictureInPicture
          oncontextmenu="return false;"
          playsinline
        ></video>
        <div class="video-watermark" id="video-watermark" aria-hidden="true"></div>
      </div>
      <p class="mywork-copy mywork-note-small">
        This view is logged and tied to your email. Refreshing or
        returning later will require entering the password again.
      </p>
    </section>

  </main>

  <script src="/mywork/mywork.js"></script>
</body>
</html>
